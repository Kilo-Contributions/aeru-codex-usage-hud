name: Local HUD security and regression tests
on:
  push:
    branches: ['hardening/loopback-request-guard-*']
  pull_request:
    paths:
      - 'server.js'
      - 'usage.js'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/local-hud-tests.yml'
permissions:
  contents: read
jobs:
  test:
    name: Node 20 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm run check
